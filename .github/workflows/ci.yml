name: integracion_continua

run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on:
  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tallerwebi_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d tallerwebi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUN_POSTGRES_TESTS: "true"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: tallerwebi_test
      DB_USER: user
      DB_PASSWORD: user

    steps:
      - run: echo "🎉 Esta tarea (job) fue lanzada automaticamente por el evento ${{ github.event_name }}"

      - run: echo "🐧 Esta tarea esta corriendo en un servidor ${{ runner.os }} por GitHub!"

      - run: echo "🔎 El nombre de la rama es ${{ github.ref }} y tu repositorio es ${{ github.repository }}."

      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: echo "💡 El repositorio ${{ github.repository }} ha sido clonado."

      - run: echo "🖥️ El workflow esta listo para testear el codigo"

      - name: Instalar dependencias de Prettier
        run: npm ci

      - name: Correr las pruebas de Maven
        run: mvn clean test

      - name: Instalar paquetes de Node para JavaScript
        run: |
          cd src/main/webapp/resources/core/js
          npm install

      - name: Ejecutar linter de JavaScript
        run: |
          cd src/main/webapp/resources/core/js
          npm run lint

      - name: Ejecutar pruebas de JavaScript
        run: |
          cd src/main/webapp/resources/core/js
          npm run test

      - name: Mostrar estado de la tarea
        if: always()
        run: echo "🍏 El estado de la tarea es ${{ job.status }}."