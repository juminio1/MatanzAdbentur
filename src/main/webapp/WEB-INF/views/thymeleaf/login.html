<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>El Matancero | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

   
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<main class="login-container">

    <section class="login-card">

       
        <div class="login-info">

            <span class="login-etiqueta">
                BIENVENIDO DE NUEVO
            </span>

            <img th:src="@{/imagenes/Logo.png}"
                 alt="El Matancero"
                 class="login-logo">

            <h1>Volvé al barrio.</h1>

            <p>
                Iniciá sesión y preparate para recorrer La Matanza,
                comprar propiedades y esquivar algún que otro quilombo.
            </p>

        </div>


        
        <div class="login-form-section">

            <div class="login-form-title">
                <span>EL MATANCERO</span>
                <h2>Iniciar sesión</h2>
                <p>Ingresá tus datos para continuar.</p>
            </div>


            <form
                    th:action="@{/validar-login}"
                    method="POST"
                    th:object="${datosLogin}">

                <!-- Credencial -->
                <div class="form-group">

                    <label for="credencial">
                        Email o Username
                    </label>

                    <input
                            th:field="*{credencial}"
                            id="credencial"
                            type="text"
                            class="form-control-login"
                            required>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                            th:field="*{password}"
                            id="password"
                            type="password"
                            class="form-control-login"
                            placeholder="Ingresá tu contraseña"
                            autocomplete="current-password"
                            required>

                </div>


                <!-- ERROR -->
                <div th:if="${error != null}"
                     class="login-error">

                    <span class="error-icon">!</span>

                    <span th:text="${error}">
                        Email o contraseña incorrectos
                    </span>

                </div>


                <!-- LOGIN -->
                <button
                        id="btn-login"
                        type="submit"
                        class="btn-ingresar"
                        enable>

                    INICIAR SESIÓN

                </button>

            </form>


            <div class="register-section">

                <span>¿Todavía no tenés cuenta?</span>

                <a id="btn-register"
                   th:href="@{/nuevo-usuario}">
                    Registrarme
                </a>

            </div>

        </div>

    </section>

</main>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
        type="module"
        th:src="@{/js/login.js}">
</script>

</body>

</html>
