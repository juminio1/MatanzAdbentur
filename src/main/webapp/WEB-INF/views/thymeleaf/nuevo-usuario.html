<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Taller Web I</title>

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM</a>
  </nav>

  <main role="main" class="container">

    <div class="container">
      <div id="loginbox" style="margin-top:50px;" class="mainbox col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
        <form action="#" th:action="@{/registrarme}" method="POST" th:object="${registro}">
          <h3 class="form-signin-heading text-center">Registro - Monopoly Matanza</h3>
          <hr class="colorgraph"><br>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input th:field="*{username}" id="username" class="form-control" placeholder="Ej: El Brian de Lafe" required />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input th:field="*{email}" type="email" id="email" class="form-control" placeholder="nombre@correo.com"
              required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input th:field="*{password}" type="password" id="password" class="form-control"
              placeholder="Contraseña segura" required />
          </div>

           <div class="mb-3">
            <label for="passwordRepetido" class="form-label">Repetir Contraseña</label>
            <input th:field="*{passwordRepetido}" type="password" id="passwordRepetido" class="form-control"
              placeholder="passwordRepetido" required />
          </div>

          <button id="btn-registrarme" class="btn btn-lg btn-primary w-100 mt-3" type="submit">Registrarme para
            Jugar</button>

          <p th:if="${error != null}" class="alert alert-danger mt-3" th:text="'Error: ' + ${error}"></p>
        </form>
      </div>
    </div>

  </main>
  <!-- /.container -->

  <!-- Boostrap core js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

</body>

</html>
