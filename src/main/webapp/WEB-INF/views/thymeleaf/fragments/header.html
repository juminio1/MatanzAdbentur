<header
    xmlns:th="http://www.thymeleaf.org"
    th:fragment="header">

    <a th:href="@{/home}">
        <img
            th:src="@{/imagenes/Logo.png}"
            alt="El Matancero"
            class="logo-nav-img">
    </a>

    <nav>

        <a href="#">Acerca de</a>

        <a href="#">¿Cómo se juega?</a>


        <!-- SIN SESIÓN -->
        <a th:if="${session.NOMBRE == null}"
           th:href="@{/login}"
           class="btn-login">

            Iniciar Sesión

        </a>


        <!-- CON SESIÓN -->
        <div th:if="${session.NOMBRE != null}"
             class="usuario-header">

            <span
                th:text="${session.NOMBRE}"
                class="nombre-usuario">
                Usuario
            </span>

            <a href="#"
               class="btn-perfil"
               aria-label="Mi perfil">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M20 21a8 8 0 0 0-16 0"></path>
                    <circle cx="12" cy="7" r="4"></circle>

                </svg>

            </a>

        </div>

    </nav>

</header>
