<header xmlns:th="http://www.thymeleaf.org" th:fragment="header" class="main-header">

    <!-- LOGO A LA IZQUIERDA -->
    <a th:href="@{/home}" class="brand-link">
        <img src="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/El%20matancero_1.svg" 
             alt="El Matancero" 
             class="logo-nav-img">
    </a>

    <!-- Enlaces y Menú de Usuario -->
    <nav class="nav-links">
        <a href="#">Acerca de</a>
        <a href="#">¿Cómo se juega?</a>

        <!-- SIN SESIÓN: Botón Iniciar Sesión -->
        <a th:if="${session.NOMBRE == null}" th:href="@{/login}" class="btn-login">
            Iniciar Sesión
        </a>

        <!-- CON SESIÓN: Avatar y Menú Desplegable -->
        <div class="user-menu-container" th:if="${session.NOMBRE != null}">
            <button id="btnUserMenu" class="user-avatar-btn" type="button" aria-expanded="false" title="Mi Cuenta">
                <img id="userNavAvatar" 
                     src="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/default.png" 
                     alt="Avatar de usuario" 
                     class="avatar-nav-img" />
            </button>

            <!-- Menú Desplegable Flotante -->
            <div id="userDropdown" class="user-dropdown-menu oculto">
                <div class="user-dropdown-header">
                    <img id="dropdownUserAvatar" 
                         src="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/default.png" 
                         alt="Avatar grande" 
                         class="avatar-dropdown-img" />
                    <div class="user-info-text">
                        <p class="user-name" id="menuUserName" th:text="${session.NOMBRE}">Usuario</p>
                        <span class="user-role" id="menuUserRole" th:text="${session.ROL != null ? session.ROL : 'USUARIO'}">USUARIO</span>
                    </div>
                </div>

                <!-- Selector de Avatares -->
                <div class="user-avatar-selector">
                    <p class="selector-title">Elegí tu avatar:</p>
                    <div class="avatar-options">
                        <button type="button" class="btn-avatar-choice" data-avatar="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar1.png">
                            <img src="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar1.png" alt="Avatar 1" />
                        </button>
                        <button type="button" class="btn-avatar-choice" data-avatar="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar2.png">
                            <img src="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar2.png" alt="Avatar 2" />
                        </button>
                        <button type="button" class="btn-avatar-choice" data-avatar="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar3.png">
                            <img src="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar3.png" alt="Avatar 3" />
                        </button>
                        <button type="button" class="btn-avatar-choice" data-avatar="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar4.png">
                            <img src="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar4.png" alt="Avatar 4" />
                        </button>
                        <button type="button" class="btn-avatar-choice" data-avatar="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar5.png">
                            <img src="https://pub-d107f234b4134823bfda878a81c2c3de.r2.dev/avatar5.png" alt="Avatar 5" />
                        </button>
                    </div>
                </div>

                <hr class="user-dropdown-divider"/>

                <div class="user-dropdown-actions">
                    <a th:href="@{/cerrar-sesion}" id="btnLogout" class="btn-logout">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

</header>
