<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Taller Web I</title>

    <!-- Boostrap core css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- custom style -->
    <link rel="stylesheet" th:href="@{/css/home.css}" />

  
</head>

<body>

        <div th:replace="~{fragments/header :: header}"></div>

    <main class="hero">
        <div class="hero-text">
            <!-- Si preferís usar la imagen del logo en vez de texto CSS, cambiá este <h1> por un <img> -->
            <img th:src="@{/imagenes/Logo.png}"
                alt="El Matancero" class="main-title-img">
            <h2 class="subtitle">Acá el que se aviva, gana.</h2>

            <p>Divertite con tus amigos mientras recorrés<br>
                La Matanza, comprás propiedades y tomá decisiones<br>
                para llegar al final con el mayor patrimonio.</p>

            <p>Inflación, cortes, oportunidades y alguna que otra<br>sorpresa.<br>
                Acá puede pasar de todo.</p>

            <a th:href="@{/login}" class="btn-play">JUGAR AHORA</a>
        </div>

        <div class="hero-image">
            <!-- ACÁ VA LA IMAGEN DEL MAPA -->
            <img th:src="@{/imagenes/ImagenCiudad.png}"
                alt="Imagen ciudad">
        </div>
    </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
